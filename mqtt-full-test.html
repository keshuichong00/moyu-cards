<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>MQTT Full Flow Test</title></head>
<body>
<h2>MQTT 联机完整流程测试</h2>
<div id="log" style="font-family:monospace;font-size:12px;white-space:pre-wrap;border:1px solid #ccc;padding:10px;max-height:500px;overflow:auto"></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const BROKER = 'wss://broker.emqx.io:8084/mqtt';
const PREFIX = 'moyu-cards-v1';
const log = (msg) => {
  const el = document.getElementById('log');
  el.textContent += new Date().toLocaleTimeString() + ' ' + msg + '\n';
  el.scrollTop = el.scrollHeight;
};

// 生成随机房间码（和游戏代码一样）
const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let code = '';
for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
log('房间码: ' + code);

// ===== 模拟主机 createRoom =====
log('\n--- 主机 createRoom ---');
const hostWillTopic = PREFIX + '/' + code + '/to_guest';
const host = mqtt.connect(BROKER, {
  clientId: 'moyu_host_' + Math.random().toString(16).substr(2, 12),
  clean: true,
  reconnectPeriod: 3000,
  connectTimeout: 8000,
  will: { topic: hostWillTopic, payload: JSON.stringify({ type: 'opponent_left' }), qos: 1, retain: false },
});

host.on('connect', () => {
  log('[主机] ✅ connect 事件触发');
  const subTopic = PREFIX + '/' + code + '/to_host';
  host.subscribe(subTopic, { qos: 1 }, (err, granted) => {
    log('[主机] 订阅 ' + subTopic + ' ' + (err ? '❌ ' + err : '✅ granted: ' + JSON.stringify(granted)));
  });
});

host.on('message', (topic, message) => {
  const text = message.toString();
  log('[主机] 📩 收到消息: ' + topic + ' => ' + text);
  try {
    const msg = JSON.parse(text);
    if (msg.type === 'opponent_joined') {
      log('[主机] ✅ 收到 opponent_joined！发送 game_init');
      const pubTopic = PREFIX + '/' + code + '/to_guest';
      host.publish(pubTopic, JSON.stringify({ type: 'game_init', state: 'test_state' }), { qos: 1 });
      log('[主机] ✅ game_init 已发送到 ' + pubTopic);
    }
  } catch(e) {
    log('[主机] ❌ JSON解析失败: ' + e.message);
  }
});

host.on('error', (e) => log('[主机] ❌ Error: ' + e.message));
host.on('close', () => log('[主机] 连接关闭'));
host.on('offline', () => log('[主机] 离线'));

// ===== 延迟2秒后模拟访客 joinRoom =====
setTimeout(() => {
  log('\n--- 访客 joinRoom ---');
  const guestWillTopic = PREFIX + '/' + code + '/to_host';
  const guest = mqtt.connect(BROKER, {
    clientId: 'moyu_guest_' + Math.random().toString(16).substr(2, 12),
    clean: true,
    reconnectPeriod: 3000,
    connectTimeout: 8000,
    will: { topic: guestWillTopic, payload: JSON.stringify({ type: 'opponent_left' }), qos: 1, retain: false },
  });

  guest.on('connect', () => {
    log('[访客] ✅ connect 事件触发');
    const subTopic = PREFIX + '/' + code + '/to_guest';
    guest.subscribe(subTopic, { qos: 1 }, (err, granted) => {
      log('[访客] 订阅 ' + subTopic + ' ' + (err ? '❌ ' + err : '✅ granted: ' + JSON.stringify(granted)));
      // 发送 opponent_joined（和游戏代码一样）
      const pubTopic = PREFIX + '/' + code + '/to_host';
      log('[访客] 发送 opponent_joined 到 ' + pubTopic);
      guest.publish(pubTopic, JSON.stringify({ type: 'opponent_joined' }), { qos: 1 });
    });
  });

  guest.on('message', (topic, message) => {
    const text = message.toString();
    log('[访客] 📩 收到消息: ' + topic + ' => ' + text);
    try {
      const msg = JSON.parse(text);
      if (msg.type === 'game_init') {
        log('[访客] ✅✅✅ 收到 game_init！联机流程成功！');
      }
    } catch(e) {
      log('[访客] ❌ JSON解析失败: ' + e.message);
    }
  });

  guest.on('error', (e) => log('[访客] ❌ Error: ' + e.message));
  guest.on('close', () => log('[访客] 连接关闭'));

  // 15秒后超时
  setTimeout(() => {
    log('\n--- 超时清理 ---');
    host.end();
    guest.end();
  }, 15000);
}, 2000);
</script>
</body>
</html>
