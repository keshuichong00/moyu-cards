<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>MQTT Browser Test</title></head>
<body>
<h2>MQTT Browser Test</h2>
<div id="log" style="font-family:monospace;font-size:12px;white-space:pre-wrap;border:1px solid #ccc;padding:10px;max-height:400px;overflow:auto"></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const log = (msg) => {
  const el = document.getElementById('log');
  el.textContent += new Date().toLocaleTimeString() + ' ' + msg + '\n';
  el.scrollTop = el.scrollHeight;
  console.log(msg);
};

log('MQTT global: ' + (typeof mqtt));
log('Connecting to wss://broker.emqx.io:8084/mqtt');

const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
  clientId: 'test_browser_' + Math.random().toString(16).substr(2, 8),
  clean: true,
  connectTimeout: 10000,
});

client.on('connect', () => {
  log('✅ Connected!');
  client.subscribe('moyu-test/test', { qos: 1 }, (err) => {
    log('Subscribe: ' + (err ? 'FAIL ' + err : 'OK'));
    // 发一条消息给自己
    client.publish('moyu-test/test', JSON.stringify({ type: 'self_test', msg: 'hello' }), { qos: 1 });
    log('Published self-test message');
  });
});

client.on('message', (topic, message) => {
  log('📩 Received on ' + topic);
  log('   message type: ' + Object.prototype.toString.call(message));
  log('   message.toString(): ' + message.toString());
  log('   TextDecoder: ' + new TextDecoder().decode(message));
  try {
    const parsed = JSON.parse(message.toString());
    log('   JSON.parse(toString) OK: ' + JSON.stringify(parsed));
  } catch(e) {
    log('   ❌ JSON.parse(toString) FAILED: ' + e.message);
  }
  try {
    const text = new TextDecoder().decode(message);
    const parsed2 = JSON.parse(text);
    log('   JSON.parse(TextDecoder) OK: ' + JSON.stringify(parsed2));
  } catch(e) {
    log('   ❌ JSON.parse(TextDecoder) FAILED: ' + e.message);
  }
});

client.on('error', (e) => log('❌ Error: ' + e.message));
client.on('close', () => log('Connection closed'));
client.on('offline', () => log('Offline'));
client.on('reconnect', () => log('Reconnecting...'));
</script>
</body>
</html>
